<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://*.supabase.co http://localhost:5055 http://127.0.0.1:5055; base-uri 'none'; form-action 'none'">
<title>Le GPT control</title>
<style>
:root{--bg:#0b0f17;--card:#121826;--line:#26314a;--txt:#d8e0f0;--dim:#7c89a8;--acc:#5eead4;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:14px}h1{font-size:18px;margin:0}header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}.dot.on{background:var(--ok)}.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
input,select,button{font:inherit;color:var(--txt);background:#0d1322;border:1px solid var(--line);border-radius:8px;padding:9px 10px}
input,select{width:100%;margin-bottom:8px}button{cursor:pointer}button:hover{border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:70px}.go{background:#12351f;border-color:#256b3d}.stop{background:#3a1717;border-color:#7a2b2b}.yes{background:#12351f}.no{background:#3a1717}
.ask{outline:2px solid var(--warn)}dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 10px}dt{color:var(--dim)}dd{margin:0;white-space:pre-wrap;word-break:break-word}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;color:#9fb0d8}.err{color:var(--bad);min-height:1.2em;margin-top:6px}.hide{display:none}.pill{padding:2px 10px;border-radius:99px;background:#1c2640}
.sub{color:var(--dim);font-size:13px;margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
</style></head><body><main>
<section id="login" class="card hide"><h2>Sign in</h2>
 <form id="lf"><input id="em" type="email" placeholder="email" autocomplete="username" required><input id="pw" type="password" placeholder="password" autocomplete="current-password" required><button class="go" style="width:100%">Sign in</button></form></section>
<div id="app" class="hide">
<header><span id="dot" class="dot"></span><h1>Le GPT</h1><span id="age" class="pill">-</span><span class="sp"></span><button id="out">Sign out</button></header>
<section class="card"><h2>Task</h2><input id="url" placeholder="site URL, saved link #N, or desktop"><input id="goal" placeholder="goal">
 <select id="mode"><option value="RISKY">Ask only on risky steps</option><option value="ALL">Ask on every step</option></select>
 <div class="row"><button class="go" data-cmd="GO">GO</button><button data-cmd="PAUSE">PAUSE</button><button data-cmd="RESUME">RESUME</button><button class="stop" data-cmd="STOP">STOP</button></div></section>
<section class="card" id="apr"><h2>Approval</h2><div class="row"><button class="yes" id="yes">YES</button><button class="no" id="no">NO</button></div></section>
<section class="card"><h2>Talk (or /help)</h2><div class="row"><input id="talk" placeholder="message or /command" style="flex:4"><button id="send" class="go">Send</button></div></section>
<section class="card"><h2>PC #2 (Helper PC)</h2>
 <div class="row">
  <input id="pc2_ip" placeholder="IP (e.g. 10.10.0.2)" style="flex:2">
  <input id="pc2_port" placeholder="Port (5056)" style="flex:1">
  <input id="pc2_name" placeholder="Name (PC #2)" style="flex:2">
 </div>
 <input id="pc2_token" type="password" placeholder="Helper PC token">
 <div class="row">
  <button id="pc2_add" class="go">Save & Connect</button>
  <button id="pc2_info">Status</button>
 </div>
 <div class="row" style="margin-top:8px">
  <input id="pc2_msg" placeholder="Message to send to PC #2" style="flex:4">
  <button id="pc2_send">Send Msg</button>
 </div>
 <div id="pc2_out" class="sub">No PC #2 status yet.</div>
</section>
<section class="card"><h2>Status</h2><dl id="st"></dl></section>
<section class="card"><h2>Log</h2><pre id="log"></pre></section>
<div class="err" id="err"></div></div>
<div class="err" id="err0"></div>
</main>
<script>
"use strict";
const CFG = { url: "https://laektajfojnzcnchddiy.supabase.co", key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxhZWt0YWpmb2puemNuY2hkZGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTUzOTMwMDAsImV4cCI6MjExMDk2OTAwMH0.l2TgPsp_LGM7CnhPg2jNJly3ic5TWRVGWO4tcBdSH60", boxUrl: "http://127.0.0.1:5055" };
const $ = id => document.getElementById(id);
const roleOf = k => { try { return JSON.parse(atob(k.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).role; } catch (e) { return ""; } };
let S = JSON.parse(sessionStorage.getItem("legpt") || "null"), busy = false;
const say = (t, id) => { $(id || "err").textContent = t || ""; };

async function api(path, opt = {}, auth = true, retry = true) {
  const h = { apikey: CFG.key, "Content-Type": "application/json", ...(opt.headers || {}) };
  if (auth) { await ensure(); h.Authorization = "Bearer " + S.access; }
  const r = await fetch(CFG.url + path, { method: opt.method || "GET", headers: h, body: opt.body ? JSON.stringify(opt.body) : undefined, cache: "no-store" });
  if (r.status === 401 && auth && retry) { S.exp = 0; return api(path, opt, auth, false); }
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.msg || j.message || j.error_description)) || ("HTTP " + r.status));
  return j;
}
function keep(j) { S = { access: j.access_token, refresh: j.refresh_token, exp: j.expires_at ? j.expires_at * 1000 : Date.now() + j.expires_in * 1000, uid: (j.user || {}).id || (S || {}).uid }; sessionStorage.setItem("legpt", JSON.stringify(S)); }
async function ensure() {
  if (!S) throw new Error("signed out");
  if (Date.now() < S.exp - 60000) return;
  const j = await api("/auth/v1/token?grant_type=refresh_token", { method: "POST", body: { refresh_token: S.refresh } }, false);
  keep(j);
}
const write = fields => api("/rest/v1/control?on_conflict=user_id", { method: "POST", headers: { Prefer: "resolution=merge-duplicates,return=minimal" }, body: { user_id: S.uid, ...fields } });

async function pc2Api(payload) {
  const r = await fetch(CFG.boxUrl + "/api/pc2", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
    cache: "no-store"
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.ok === false) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

function renderPc2(pc2, extraReply) {
  if (!pc2) return;
  if (pc2.ip && !$("pc2_ip").value) $("pc2_ip").value = pc2.ip;
  if (pc2.name && !$("pc2_name").value) $("pc2_name").value = pc2.name;
  const parts = [];
  if (extraReply) parts.push(extraReply);
  if (pc2.configured) {
    parts.push(`${pc2.name || "PC #2"} (${pc2.ip}): ${pc2.online ? "ONLINE" : "OFFLINE"}${pc2.error ? " - " + pc2.error : ""}`);
  } else {
    parts.push("PC #2 is not configured yet.");
  }
  $("pc2_out").textContent = parts.join(" | ");
}

function show(on) { $("login").classList.toggle("hide", on); $("app").classList.toggle("hide", !on); }
async function loadControl() {
  const rows = await api(`/rest/v1/control?user_id=eq.${S.uid}&select=url,goal,mode`);
  if (rows && rows[0]) { $("url").value = rows[0].url || ""; $("goal").value = rows[0].goal || ""; $("mode").value = rows[0].mode || "RISKY"; }
}
const FIELDS = [["state", "State"], ["page", "Page / screen"], ["next", "Next move"], ["say", "LLM says"], ["result", "Result"], ["stats", "Steps / tokens"], ["eff", "Efficiency"], ["report", "Report"], ["links", "Saved links"], ["session", "Session"], ["export", "Export code"]];
function render(row) {
  const d = (row && row.data) || {}, age = row ? (Date.now() - new Date(row.updated_at).getTime()) / 1000 : 1e9, on = age < 25;
  $("dot").classList.toggle("on", on); $("age").textContent = row ? (on ? "PC online" : "PC quiet for " + (age > 3600 ? Math.round(age / 3600) + " h" : Math.round(age / 60) + " min")) : "no PC yet";
  const st = $("st"); st.textContent = "";
  for (const [k, label] of FIELDS) { if (d[k] === undefined || d[k] === "") continue; const a = document.createElement("dt"), b = document.createElement("dd"); a.textContent = label; b.textContent = String(d[k]).slice(0, 1500); st.append(a, b); }
  if (d.cpu !== undefined) { const a = document.createElement("dt"), b = document.createElement("dd"); a.textContent = "CPU / GPU / RAM"; b.textContent = [d.cpu, d.gpu, d.ram].map(x => (x === undefined || x === "" ? "-" : x + "%")).join("  /  "); st.append(a, b); }
  $("log").textContent = (d.log || []).slice(-12).join("\n");
  $("apr").classList.toggle("ask", /approv|wait|confirm/i.test(String(d.state || "") + " " + String(d.say || "")));
  if (d.box && d.box.pc2) renderPc2(d.box.pc2);
}
async function poll() {
  if (!S || busy) return;
  try { const rows = await api(`/rest/v1/status?user_id=eq.${S.uid}&select=data,updated_at`); render(rows && rows[0]); say(""); }
  catch (e) { say("Lost connection: " + e.message); if (/signed out|Invalid Refresh/i.test(e.message)) logout(); }
}
function logout() { S = null; sessionStorage.removeItem("legpt"); show(false); }
async function act(fn) { busy = true; try { await fn(); say(""); } catch (e) { say(e.message); } busy = false; poll(); }

$("lf").onsubmit = async ev => {
  ev.preventDefault(); say("", "err0");
  try { keep(await api("/auth/v1/token?grant_type=password", { method: "POST", body: { email: $("em").value.trim(), password: $("pw").value } }, false)); $("pw").value = ""; await start(); }
  catch (e) { say("Sign-in failed: " + e.message, "err0"); }
};
$("out").onclick = logout;
document.querySelectorAll("[data-cmd]").forEach(b => b.onclick = () => act(() => write(b.dataset.cmd === "GO" ? { url: $("url").value.trim(), goal: $("goal").value.trim(), cmd: "GO" } : { cmd: b.dataset.cmd })));
$("yes").onclick = () => act(() => write({ approval: "YES" })); $("no").onclick = () => act(() => write({ approval: "NO" }));
$("mode").onchange = () => act(() => write({ mode: $("mode").value }));
const send = () => { const t = $("talk").value.trim(); if (!t) return; $("talk").value = ""; act(() => write({ talk: t })); };
$("send").onclick = send; $("talk").onkeydown = e => { if (e.key === "Enter") send(); };

$("pc2_add").onclick = () => act(async () => {
  const res = await pc2Api({
    op: "add",
    ip: $("pc2_ip").value.trim(),
    port: Number($("pc2_port").value.trim() || 5056),
    token: $("pc2_token").value,
    name: $("pc2_name").value.trim() || "PC #2"
  });
  $("pc2_token").value = "";
  renderPc2(res.pc2, res.reply);
});
$("pc2_info").onclick = () => act(async () => {
  const res = await pc2Api({ op: "info" });
  renderPc2(res.pc2, res.reply);
});
const sendPc2Msg = () => {
  const txt = $("pc2_msg").value.trim();
  if (!txt) return;
  act(async () => {
    const res = await pc2Api({ op: "msg", text: txt });
    $("pc2_msg").value = "";
    renderPc2(res.pc2, res.reply);
  });
};
$("pc2_send").onclick = sendPc2Msg;
$("pc2_msg").onkeydown = e => { if (e.key === "Enter") sendPc2Msg(); };

async function start() { show(true); await loadControl().catch(() => {}); poll(); }
(function init() {
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(CFG.url) || CFG.key.startsWith("YOUR_")) { show(false); $("login").classList.add("hide"); say("Edit CFG at the top of the script: your Supabase project URL and PUBLIC anon key.", "err0"); return; }
  if (roleOf(CFG.key) === "service_role" || CFG.key.startsWith("sb_secret_")) { say("That is a SECRET key. Remove it from this page now and use the public anon/publishable key.", "err0"); return; }
  if (S) start().catch(logout); else show(false);
  setInterval(() => document.hidden || poll(), 2500);
})();
</script></body></html>
